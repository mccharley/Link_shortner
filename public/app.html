<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Link Shortener</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
            width: 100%;
            max-width: 600px;
            margin: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input[type="url"], input[type="text"], input[type="datetime-local"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        input[type="url"]:focus, input[type="text"]:focus, input[type="datetime-local"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }

        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .short-url {
            font-size: 1.2em;
            font-weight: 600;
            word-break: break-all;
            margin: 10px 0;
            padding: 10px;
            background: rgba(255,255,255,0.8);
            border-radius: 5px;
        }

        .copy-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
        }

        .copy-btn:hover {
            background: #218838;
        }

        .advanced-options {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .advanced-toggle {
            background: none;
            border: none;
            color: #667eea;
            font-size: 14px;
            cursor: pointer;
            text-decoration: underline;
        }

        .advanced-content {
            display: none;
            margin-top: 15px;
        }

        .advanced-content.show {
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .stats {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .stats h3 {
            color: #333;
            margin-bottom: 15px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 10px;
            background: white;
            border-radius: 5px;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #666;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                padding: 20px;
            }

            .header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔗 Link Shortener</h1>
            <p>Create short, secure, and trackable links</p>
        </div>

        <form id="linkForm">
            <div class="form-group">
                <label for="url">Enter your URL:</label>
                <input type="url" id="url" name="url" placeholder="https://example.com" required>
            </div>

            <div class="advanced-options">
                <button type="button" class="advanced-toggle" onclick="toggleAdvanced()">
                    Advanced Options ▼
                </button>
                <div class="advanced-content" id="advancedContent">
                    <div class="form-group">
                        <label for="customCode">Custom Short Code (optional):</label>
                        <input type="text" id="customCode" name="customCode" placeholder="my-custom-code" maxlength="20">
                    </div>
                    <div class="form-group">
                        <label for="expiresAt">Expiration Date (optional):</label>
                        <input type="datetime-local" id="expiresAt" name="expiresAt">
                    </div>
                </div>
            </div>

            <button type="submit" class="btn" id="submitBtn">Shorten URL</button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Creating your short link...</p>
        </div>

        <div class="result" id="result">
            <div id="resultContent"></div>
        </div>

        <div class="stats" id="stats" style="display: none;">
            <h3>System Statistics</h3>
            <div id="statsContent"></div>
        </div>

        <div class="footer">
            <p>Powered by Modern Link Shortener v2.0 | Built with security and performance in mind</p>
        </div>
    </div>

    <script>
        let csrfToken = null;

        // Get CSRF token on page load
        async function getCSRFToken() {
            try {
                const response = await fetch('/api/csrf-token');
                const data = await response.json();
                if (data.success) {
                    csrfToken = data.data.csrf_token;
                }
            } catch (error) {
                console.error('Failed to get CSRF token:', error);
            }
        }

        // Initialize the application
        async function init() {
            await getCSRFToken();
            loadStats();
        }

        // Toggle advanced options
        function toggleAdvanced() {
            const content = document.getElementById('advancedContent');
            const toggle = document.querySelector('.advanced-toggle');
            
            if (content.classList.contains('show')) {
                content.classList.remove('show');
                toggle.textContent = 'Advanced Options ▼';
            } else {
                content.classList.add('show');
                toggle.textContent = 'Advanced Options ▲';
            }
        }

        // Handle form submission
        document.getElementById('linkForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            
            // Show loading state
            submitBtn.disabled = true;
            loading.style.display = 'block';
            result.style.display = 'none';
            
            try {
                const formData = new FormData(this);
                const data = {
                    url: formData.get('url'),
                    csrf_token: csrfToken
                };
                
                // Add optional fields if provided
                if (formData.get('customCode')) {
                    data.custom_code = formData.get('customCode');
                }
                if (formData.get('expiresAt')) {
                    data.expires_at = formData.get('expiresAt');
                }
                
                const response = await fetch('/api/links', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });
                
                const responseData = await response.json();
                
                if (responseData.success) {
                    showResult('success', responseData.data, responseData.message);
                    this.reset();
                    loadStats(); // Refresh stats
                } else {
                    showResult('error', null, responseData.error);
                }
                
            } catch (error) {
                console.error('Error:', error);
                showResult('error', null, 'Network error. Please try again.');
            } finally {
                submitBtn.disabled = false;
                loading.style.display = 'none';
            }
        });

        // Show result
        function showResult(type, data, message) {
            const result = document.getElementById('result');
            const resultContent = document.getElementById('resultContent');
            
            result.className = `result ${type}`;
            
            if (type === 'success' && data) {
                resultContent.innerHTML = `
                    <p><strong>Success!</strong> ${message}</p>
                    <div class="short-url" id="shortUrl">${data.short_url}</div>
                    <button class="copy-btn" onclick="copyToClipboard('${data.short_url}')">Copy Link</button>
                    <p><small>Original URL: ${data.original_url}</small></p>
                    ${data.expires_at ? `<p><small>Expires: ${new Date(data.expires_at).toLocaleString()}</small></p>` : ''}
                `;
            } else {
                resultContent.innerHTML = `<p><strong>Error:</strong> ${message}</p>`;
            }
            
            result.style.display = 'block';
        }

        // Copy to clipboard
        async function copyToClipboard(text) {
            try {
                await navigator.clipboard.writeText(text);
                
                // Show feedback
                const copyBtn = event.target;
                const originalText = copyBtn.textContent;
                copyBtn.textContent = 'Copied!';
                copyBtn.style.background = '#6c757d';
                
                setTimeout(() => {
                    copyBtn.textContent = originalText;
                    copyBtn.style.background = '#28a745';
                }, 2000);
                
            } catch (error) {
                console.error('Failed to copy:', error);
                
                // Fallback for older browsers
                const textArea = document.createElement('textarea');
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
            }
        }

        // Load system statistics
        async function loadStats() {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();
                
                if (data.success && data.data) {
                    const stats = data.data;
                    const statsContent = document.getElementById('statsContent');
                    
                    statsContent.innerHTML = `
                        <div class="stat-item">
                            <span>Total Links:</span>
                            <span>${stats.total_links || 0}</span>
                        </div>
                        <div class="stat-item">
                            <span>Total Clicks:</span>
                            <span>${stats.total_clicks || 0}</span>
                        </div>
                        <div class="stat-item">
                            <span>Unique Users:</span>
                            <span>${stats.unique_creators || 0}</span>
                        </div>
                        <div class="stat-item">
                            <span>Avg Clicks/Link:</span>
                            <span>${stats.avg_clicks_per_link ? parseFloat(stats.avg_clicks_per_link).toFixed(1) : '0.0'}</span>
                        </div>
                    `;
                    
                    document.getElementById('stats').style.display = 'block';
                }
            } catch (error) {
                console.error('Failed to load stats:', error);
            }
        }

        // Input validation
        document.getElementById('url').addEventListener('input', function() {
            const url = this.value;
            const submitBtn = document.getElementById('submitBtn');
            
            if (url && !isValidUrl(url)) {
                this.setCustomValidity('Please enter a valid URL');
                submitBtn.disabled = true;
            } else {
                this.setCustomValidity('');
                submitBtn.disabled = false;
            }
        });

        // URL validation helper
        function isValidUrl(string) {
            try {
                const url = new URL(string);
                return url.protocol === 'http:' || url.protocol === 'https:';
            } catch (_) {
                return false;
            }
        }

        // Custom code validation
        document.getElementById('customCode').addEventListener('input', function() {
            const code = this.value;
            const pattern = /^[a-zA-Z0-9_-]{3,20}$/;
            
            if (code && !pattern.test(code)) {
                this.setCustomValidity('Custom code must be 3-20 characters long and contain only letters, numbers, hyphens, and underscores');
            } else {
                this.setCustomValidity('');
            }
        });

        // Initialize the application when the page loads
        document.addEventListener('DOMContentLoaded', init);

        // Refresh CSRF token every 30 minutes
        setInterval(getCSRFToken, 30 * 60 * 1000);
    </script>
</body>
</html>
